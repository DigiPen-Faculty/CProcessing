# Once a week, compares the pinned dependencies (GLFW, SoLoud, miniaudio,
# NanoVG, stb, Unity, clang-format, Mesa) with upstream and keeps one open
# issue, "Upstream dependency updates", while any of them has a newer
# version. It only reports: updating is a decision, made by hand with the
# steps in DEPENDENCIES.md. Dependabot covers the GitHub Actions versions.
#
# Run it any time with `python tools/check_dependencies.py`, or from the
# Actions tab. GitHub only runs a schedule from the default branch, so the
# weekly run starts once this file is on `main`; a pull request that changes
# the script or this file runs the report (without touching issues), so a
# change to either is tested before it lands.
name: dependency check

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - tools/check_dependencies.py
      - .github/workflows/dependency_check.yml

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Compare the pins with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_dependencies.py --markdown report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES: ${{ steps.check.outputs.updates }}
        run: |
          title="Upstream dependency updates"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$UPDATES" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$title" --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Everything pinned is current again."
          fi
