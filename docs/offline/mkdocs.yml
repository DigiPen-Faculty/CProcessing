site_name: CProcessing Documentation
site_description: Offline API reference for CProcessing
docs_dir: work/wiki
site_dir: work/site
use_directory_urls: false
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    primary: deep purple
    accent: amber

plugins:
  # Underscores separate words too, so "DrawCircle" finds CP_Graphics_DrawCircle
  - search:
      separator: '[\s\-_,:!=\[\]()"/]+'
  # Makes the site work when opened straight from the disk (a file: URL),
  # search included, so students need no web server
  - offline
  - print-site:
      print_page_title: Complete CProcessing Documentation
      add_to_navigation: true

markdown_extensions:
  - attr_list
  - toc:
      permalink: true

# Only used when the wiki has no _Sidebar.md: build.ps1 builds with a copy of
# this file whose nav comes from the sidebar (prepare_wiki.py --config)
nav:
  - Home: index.md
  - API Reference:
      - Engine: Engine.md
      - System: System.md
      - Settings: Settings.md
      - Color: Color.md
      - Graphics: Graphics.md
      - Image: Image.md
      - Sound: Sound.md
      - Font: Font.md
      - Input: Input.md
      - Math: Math.md
      - Vector: Vector.md
      - Matrix: Matrix.md
      - Random: Random.md
      - Types: Types.md
